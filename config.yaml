    - C:\Users\Admin\Developer\tabbit-browser\mcp-server.js
    command: C:\Users\Admin\.hermes-web-ui\desktop-runtime\hermes\0.19.0\win-x64\node\node.exe
    enabled: true
    env:
      TABBIT_CDP_TIMEOUT: '60000'
      TABBIT_PORT: '9222'
  trendradar-mcp:
    args: []
    command: C:\Users\Admin\Developer\TrendRadar\.venv\Scripts\trendradar-mcp.exe
    enabled: true
  mijia-api:
    args:
    - mijiaAPI
    - mcp
    command: uvx
    enabled: true
  apify-mcp:
    command: npx
    args:
    - -y
    - '@apify/actors-mcp-server'
    env:
      APIFY_TOKEN: ***
    enabled: true
  playwright-mcp:
    command: npx
    args:
    - -y
    - '@playwright/mcp'
    enabled: true
  computer-control-mcp:
