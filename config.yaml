model:
  default: gemini-3.5-flash
  provider: custom:gemini
auxiliary:
  vision:
    provider: custom:gemini
    model: gemini-3.5-flash
    timeout: 120
display:
  bell_on_complete: true
  show_reasoning: true
  streaming: true
  show_cost: true
  notify_on_complete: true
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 40000
  user_char_limit: 40000
  provider: hindsight
moa:
  default_preset: Mind-Daily
  active_preset: ''
  presets:
    Mind-Daily:
      enabled: true
      reference_models:
      - provider: custom:183399
        model: qwen3.7-plus
      - provider: custom:183399
        model: deepseek-v4-pro
      - provider: custom:183399
        model: glm-5.2
      - provider: custom:topapi
        model: MiniMax-M3
      - provider: custom:心流grop
        model: gpt-5.5
      aggregator:
        provider: custom:183399
        model: deepseek-v4-flash
      reference_temperature: 0.6
      aggregator_temperature: 0.4
      max_tokens: 4096
command_allowlist:
- execute_code
- shell command via -c/-lc flag
- script execution via -e/-c flag
onboarding:
  seen:
    profile_build_offered: true
    busy_input_prompt: true
_config_version: 32
mcp_servers:
